name: Derle ve yayınla

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        shell: cmd
        run: derle.bat /ci

      - name: Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: Ahmetview 0.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}
          files: Ahmetview.exe
          fail_on_unmatched_files: true
          make_latest: true
